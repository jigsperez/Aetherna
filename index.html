<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHERNA - Online Store</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background-color: #fef6f8;
      color: #333;
    }
    header {
      background-color: #ffdbe7;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    header h1 {
      margin: 0;
      font-size: 2rem;
      color: #c97a95;
    }
    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #7a4c58;
      font-weight: bold;
    }
    section {
      padding: 2rem;
    }
    #product-list, #admin-products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .product-card {
      background: #ffffff;
      border: 1px solid #e3c6cc;
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .product-card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    button {
      background-color: #ffb6c1;
      color: white;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:hover {
      background-color: #ff92aa;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>AETHERNA</h1>
    <nav>
      <a href="#home" onclick="showSection('home')">Home</a>
      <a href="#cart" onclick="showSection('cart')">Cart (<span id="cart-count">0</span>)</a>
      <a href="#admin" onclick="showSection('admin')">Admin</a>
    </nav>
  </header>

  <main>
    <section id="home">
      <h2>Our Products</h2>
      <div id="product-list"></div>
    </section>

    <section id="product-detail" class="hidden">
      <button onclick="goBack()">Back to Products</button>
      <div id="product-info"></div>
    </section>

    <section id="cart" class="hidden">
      <h2>Shopping Cart</h2>
      <ul id="cart-items"></ul>
      <p>Total: $<span id="cart-total">0.00</span></p>
    </section>

    <section id="admin" class="hidden">
      <h2>Admin Panel</h2>
      <form id="admin-form">
        <input type="text" id="name" placeholder="Product Name" required>
        <input type="text" id="category" placeholder="Category" required>
        <input type="number" id="price" placeholder="Price" required>
        <input type="text" id="image" placeholder="Image URL" required>
        <button type="submit">Add Product</button>
      </form>
      <div id="admin-products"></div>
    </section>
  </main>

  <script>
    let products = [
      { id: 1, name: "Pastel Shirt", category: "Shirts", price: 25, image: "https://via.placeholder.com/200x200?text=Shirt" },
      { id: 2, name: "Handmade Vase", category: "Arts and Craft", price: 40, image: "https://via.placeholder.com/200x200?text=Vase" },
      { id: 3, name: "Pearl Necklace", category: "Accessories", price: 30, image: "https://via.placeholder.com/200x200?text=Necklace" },
    ];

    let cart = [];

    function renderProducts() {
      const container = document.getElementById("product-list");
      container.innerHTML = "";
      products.forEach(product => {
        const div = document.createElement("div");
        div.className = "product-card";
        div.innerHTML = `
          <img src="${product.image}" alt="${product.name}">
          <h3>${product.name}</h3>
          <p>$${product.price.toFixed(2)}</p>
          <button onclick="addToCart(${product.id})">Add to Cart</button>
          <button onclick="viewProduct(${product.id})">View</button>
        `;
        container.appendChild(div);
      });
    }

    function renderCart() {
      const container = document.getElementById("cart-items");
      const total = document.getElementById("cart-total");
      container.innerHTML = "";
      let sum = 0;
      cart.forEach(item => {
        const li = document.createElement("li");
        li.textContent = `${item.name} - $${item.price.toFixed(2)}`;
        container.appendChild(li);
        sum += item.price;
      });
      total.textContent = sum.toFixed(2);
      document.getElementById("cart-count").textContent = cart.length;
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (product) {
        cart.push(product);
        renderCart();
      }
    }

    function viewProduct(id) {
      const product = products.find(p => p.id === id);
      const container = document.getElementById("product-info");
      container.innerHTML = `
        <img src="${product.image}" style="max-width: 300px">
        <h3>${product.name}</h3>
        <p>Category: ${product.category}</p>
        <p>Price: $${product.price.toFixed(2)}</p>
        <button onclick="addToCart(${product.id})">Add to Cart</button>
      `;
      showSection("product-detail");
    }

    function goBack() {
      showSection("home");
    }

    function showSection(id) {
      document.querySelectorAll("main section").forEach(s => s.classList.add("hidden"));
      document.getElementById(id).classList.remove("hidden");
    }

    document.getElementById("admin-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const category = document.getElementById("category").value;
      const price = parseFloat(document.getElementById("price").value);
      const image = document.getElementById("image").value;
      const id = products.length ? products[products.length - 1].id + 1 : 1;
      const newProduct = { id, name, category, price, image };
      products.push(newProduct);
      renderProducts();
      renderAdminProducts();
      this.reset();
    });

    function renderAdminProducts() {
      const container = document.getElementById("admin-products");
      container.innerHTML = "";
      products.forEach(product => {
        const div = document.createElement("div");
        div.className = "product-card";
        div.innerHTML = `
          <img src="${product.image}" alt="${product.name}">
          <h3>${product.name}</h3>
          <p>${product.category} - $${product.price.toFixed(2)}</p>
          <button onclick="deleteProduct(${product.id})">Remove</button>
        `;
        container.appendChild(div);
      });
    }

    function deleteProduct(id) {
      products = products.filter(p => p.id !== id);
      renderProducts();
      renderAdminProducts();
    }

    renderProducts();
    renderAdminProducts();
  </script>
</body>
</html>
